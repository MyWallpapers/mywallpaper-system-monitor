name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: system-monitor-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable the package manager pinned by package.json
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm typecheck && pnpm build

  native:
    name: native-x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout add-on without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: addon
          persist-credentials: false

      - name: Checkout the exact trusted toolchain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MyWallpapers/native-addon-toolchain
          ref: d25e283c8bffc524fcb7334b59a402b2eda95891
          path: toolchain
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: toolchain/.nvmrc

      - name: Build the declared x64 companion
        shell: pwsh
        run: |
          node toolchain/.github/scripts/build-native-companions.mjs `
            --repository-root addon `
            --output-root "$env:RUNNER_TEMP/mywallpaper-companion-output"
