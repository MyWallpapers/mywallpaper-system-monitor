name: Publish MyWallpaper release through admission-v1

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    if: github.event.repository.private == false
    concurrency:
      group: mywallpaper-release-${{ github.repository_id }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: MyWallpapers/native-addon-toolchain/.github/workflows/native-addon-build.yml@6016d530eeddac9eddf8ec17a27f2a1727e847c8
    with:
      channel: development
